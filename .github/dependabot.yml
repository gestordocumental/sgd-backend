version: 2

updates:
  # ── GitHub Actions ─────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "ci"]
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Major version bumps require manual validation
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ── Workspace root (eslint, typescript, etc.) ──────────────────────────────
  # This scope resolves against the single root package-lock.json, so it also
  # groups bumps for every workspace member's dependencies (class-validator,
  # typeorm, etc.) — not just the root package.json's own devDependencies.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies"]
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      # Major version bumps require manual validation
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # These are still pre-1.0 — by semver convention a "minor" bump on a
      # 0.x package is where breaking changes land, so Dependabot's own
      # "minor is safe" assumption above doesn't hold for them. Confirmed by
      # PR #136 (class-validator 0.14→0.15 broke Build + Contract Tests +
      # Integration Tests across every service in one grouped PR).
      - dependency-name: "class-validator"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "class-transformer"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "reflect-metadata"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "typeorm"
        update-types: ["version-update:semver-minor"]

  # ── @sgd/common ────────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/packages/common"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "common"]
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Still pre-1.0 — a "minor" bump is their breaking-change slot.
      # PR #135 (auto-instrumentations-node/exporter-trace-otlp-http/sdk-node
      # 0.x bumps grouped as "minor") broke Lint + Build for every consumer of
      # this package, since it's shared by all services.
      - dependency-name: "@opentelemetry/*"
        update-types: ["version-update:semver-minor"]

